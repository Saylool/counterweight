[package]
name = "counterweight-policy"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# TEST ONLY: never enable either feature for a custody contract.
test-utils = []
day1-placeholder-digest = []
sandbox-tests = ["dep:near-workspaces", "dep:tokio", "dep:anyhow"]

[dependencies]
near-sdk = "=5.30.1"
near-workspaces = { version = "=0.24.0", optional = true, default-features = false, features = ["rustls"] }
tokio = { version = "1", optional = true, features = ["macros", "rt-multi-thread"] }
anyhow = { version = "1", optional = true }

[dev-dependencies]
near-sdk = { version = "=5.30.1", features = ["unit-testing"] }

[[test]]
name = "sandbox"
path = "tests/sandbox.rs"
required-features = ["sandbox-tests"]

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[workspace]
members = ["tests/mock-signer"]
